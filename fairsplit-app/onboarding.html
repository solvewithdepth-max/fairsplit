<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Setup - FairSplit</title>

    <meta name="theme-color" content="#FF6E4E">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        coral: '#FF6E4E',
                        veg: '#10B981',
                        nonveg: '#EF4444',
                        primary: 'var(--color-text-primary)',
                        secondary: 'var(--color-text-secondary)',
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    keyframes: { slideUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } } },
                    animation: { slideUp: 'slideUp 0.5s ease-out forwards' }
                }
            }
        }
    </script>
    <style>
        :root {
            --color-text-primary: #1F2937;
            --color-text-secondary: #6B7280;
        }

        html.dark {
            --color-text-primary: #F3F4F6;
            --color-text-secondary: #9CA3AF;
        }
    </style>
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>

<body
    class="bg-gray-100 dark:bg-[#0a0a0a] flex justify-center text-primary font-sans antialiased min-h-screen overflow-hidden">

    <div
        class="w-full max-w-md bg-white/60 dark:bg-black/20 backdrop-blur-3xl min-h-screen relative shadow-2xl border-x border-white/60 dark:border-white/10 flex flex-col z-10 p-6 pt-12">

        <div class="flex-1 flex flex-col animate-slideUp">

            <div class="mb-8">
                <span class="text-[10px] font-bold text-coral uppercase tracking-widest mb-1 block">Step 1 of 1</span>
                <h2 class="text-3xl font-black text-primary tracking-tight">Set up profile</h2>
                <p class="text-sm text-secondary mt-1">This helps us automate your bill splitting later.</p>
            </div>

            <div class="space-y-6">
                <div>
                    <label class="block text-[10px] font-bold text-secondary uppercase tracking-widest mb-2 ml-1">Your
                        Name</label>
                    <div
                        class="flex items-center bg-white/50 dark:bg-black/40 border border-black/5 dark:border-white/5 rounded-2xl px-4 py-3.5 shadow-inner focus-within:border-coral transition-all">
                        <i data-lucide="user" class="w-5 h-5 text-secondary mr-3"></i>
                        <input type="text" id="name-input" placeholder="e.g. Rahul"
                            class="w-full bg-transparent outline-none text-base font-bold text-primary placeholder-secondary/50"
                            oninput="validateForm()">
                    </div>
                </div>

                <div>
                    <label
                        class="block text-[10px] font-bold text-secondary uppercase tracking-widest mb-2 ml-1 flex items-center justify-between">
                        Default Diet
                        <span class="text-secondary/50 font-medium text-[9px] lowercase italic">You can change this per
                            bill</span>
                    </label>

                    <div class="grid grid-cols-3 gap-2">
                        <button id="diet-veg" onclick="selectDiet('veg')"
                            class="py-4 rounded-2xl border-2 border-veg/50 bg-veg/10 text-veg font-bold flex flex-col items-center justify-center gap-2 transition-all active:scale-95 shadow-sm">
                            <i data-lucide="leaf" class="w-6 h-6 stroke-[2.5]"></i>
                            <span class="text-xs">Veg</span>
                        </button>

                        <button id="diet-nv" onclick="selectDiet('nv')"
                            class="py-4 rounded-2xl border-2 border-transparent bg-black/5 dark:bg-white/5 text-secondary hover:bg-black/10 dark:hover:bg-white/10 font-bold flex flex-col items-center justify-center gap-2 transition-all active:scale-95">
                            <i data-lucide="drumstick" class="w-6 h-6 stroke-[2.5]"></i>
                            <span class="text-xs">Non-Veg</span>
                        </button>

                        <button id="diet-both" onclick="selectDiet('both')"
                            class="py-4 rounded-2xl border-2 border-transparent bg-black/5 dark:bg-white/5 text-secondary hover:bg-black/10 dark:hover:bg-white/10 font-bold flex flex-col items-center justify-center gap-2 transition-all active:scale-95">
                            <i data-lucide="utensils" class="w-6 h-6 stroke-[2.5]"></i>
                            <span class="text-xs">Both</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="mt-auto pb-4">
                <button id="btn-complete" disabled onclick="completeSetup()"
                    class="w-full bg-black/10 dark:bg-white/10 text-secondary py-4 rounded-2xl text-lg font-bold transition-all cursor-not-allowed flex items-center justify-center gap-2">
                    Complete Setup <i data-lucide="check-circle" class="w-5 h-5 stroke-[2.5]"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        let currentDiet = 'veg'; // Default selection

        function selectDiet(diet) {
            currentDiet = diet;
            const btnVeg = document.getElementById('diet-veg');
            const btnNv = document.getElementById('diet-nv');
            const btnBoth = document.getElementById('diet-both');

            // Reset all to unselected
            [btnVeg, btnNv, btnBoth].forEach(btn => {
                btn.className = "py-4 rounded-2xl border-2 border-transparent bg-black/5 dark:bg-white/5 text-secondary hover:bg-black/10 dark:hover:bg-white/10 font-bold flex flex-col items-center justify-center gap-2 transition-all active:scale-95";
            });

            // Highlight selected
            if (diet === 'veg') btnVeg.className = "py-4 rounded-2xl border-2 border-veg/50 bg-veg/10 text-veg font-bold flex flex-col items-center justify-center gap-2 transition-all active:scale-95 shadow-sm";
            if (diet === 'nv') btnNv.className = "py-4 rounded-2xl border-2 border-nonveg/50 bg-nonveg/10 text-nonveg font-bold flex flex-col items-center justify-center gap-2 transition-all active:scale-95 shadow-sm";
            if (diet === 'both') btnBoth.className = "py-4 rounded-2xl border-2 border-coral/50 bg-coral/10 text-coral font-bold flex flex-col items-center justify-center gap-2 transition-all active:scale-95 shadow-sm";
        }

        function validateForm() {
            const nameInput = document.getElementById('name-input').value.trim();
            const btn = document.getElementById('btn-complete');

            if (nameInput.length > 0) {
                btn.disabled = false;
                btn.className = "w-full bg-coral text-white py-4 rounded-2xl text-lg font-bold shadow-[0_4px_20px_rgba(255,110,78,0.4)] active:scale-95 transition-all flex items-center justify-center gap-2";
            } else {
                btn.disabled = true;
                btn.className = "w-full bg-black/10 dark:bg-white/10 text-secondary py-4 rounded-2xl text-lg font-bold transition-all cursor-not-allowed flex items-center justify-center gap-2";
            }
        }

        function completeSetup() {
            const name = document.getElementById('name-input').value.trim();
            if (!name) return;

            // To be replaced with Supabase INSERT logic
            alert(`Profile Saved!\nName: ${name}\nDiet: ${currentDiet}`);

            // Send them into the main app
            window.location.href = 'index.html';
        }
    </script>
</body>

</html>
