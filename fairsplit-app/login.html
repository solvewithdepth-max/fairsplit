<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - FairSplit</title>

    <meta name="theme-color" content="#FF6E4E">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        coral: '#FF6E4E',
                        primary: 'var(--color-text-primary)',
                        secondary: 'var(--color-text-secondary)',
                        bordercolor: 'var(--color-border)'
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    },
                    animation: { float: 'float 3s ease-in-out infinite', slideUp: 'slideUp 0.6s ease-out forwards' }
                }
            }
        }
    </script>
    <style>
        :root {
            --color-app-bg: #F3F4F6;
            --color-bg: #FDFBF7;
            --color-text-primary: #1F2937;
            --color-text-secondary: #6B7280;
        }

        html.dark {
            --color-app-bg: #050505;
            --color-bg: #121212;
            --color-text-primary: #F3F4F6;
            --color-text-secondary: #9CA3AF;
        }
    </style>
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>

<body
    class="bg-gray-100 dark:bg-[#0a0a0a] flex justify-center text-primary font-sans antialiased min-h-screen overflow-hidden">

    <div
        class="fixed top-[-15%] left-[-15%] w-[400px] h-[400px] bg-coral/20 dark:bg-coral/10 rounded-full mix-blend-multiply dark:mix-blend-screen filter blur-[100px] pointer-events-none z-0 animate-float">
    </div>
    <div class="fixed bottom-[-15%] right-[-15%] w-[400px] h-[400px] bg-blue-500/20 dark:bg-blue-500/10 rounded-full mix-blend-multiply dark:mix-blend-screen filter blur-[100px] pointer-events-none z-0"
        style="animation: float 4s ease-in-out infinite reverse;"></div>

    <div
        class="w-full max-w-md bg-white/60 dark:bg-black/20 backdrop-blur-3xl min-h-screen relative shadow-2xl border-x border-white/60 dark:border-white/10 flex flex-col z-10 p-6 pt-12">

        <div class="flex-1 flex flex-col justify-center animate-slideUp">

            <div
                class="w-16 h-16 bg-coral/10 text-coral rounded-2xl flex items-center justify-center shadow-sm mb-6 mx-auto">
                <i data-lucide="receipt" class="w-8 h-8 stroke-[2.5]"></i>
            </div>

            <h1 class="text-3xl font-black tracking-tight text-center mb-2">Fair<span class="text-coral">Split</span>
            </h1>
            <p class="text-sm text-secondary text-center mb-8 px-4">Sign in to sync your ledgers and stop subsidizing
                your friends' drinks.</p>

            <div
                class="bg-white/5 dark:bg-black/40 border border-black/5 dark:border-white/10 rounded-3xl p-5 shadow-sm backdrop-blur-md">

                <button onclick="simulateGoogleLogin()"
                    class="w-full bg-white dark:bg-[#1A1A1A] border border-black/10 dark:border-white/10 text-primary py-3.5 rounded-xl text-sm font-bold shadow-sm hover:bg-gray-50 dark:hover:bg-[#252525] transition-all flex justify-center items-center gap-3 active:scale-95 mb-4">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                            fill="#4285F4" />
                        <path
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                            fill="#34A853" />
                        <path
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                            fill="#FBBC05" />
                        <path
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                            fill="#EA4335" />
                    </svg>
                    Continue with Google
                </button>

                <div class="flex items-center gap-3 mb-4">
                    <div class="h-px bg-black/10 dark:bg-white/10 flex-1"></div>
                    <span class="text-[10px] uppercase tracking-widest text-secondary font-bold">OR</span>
                    <div class="h-px bg-black/10 dark:bg-white/10 flex-1"></div>
                </div>

                <div class="space-y-3">
                    <div
                        class="flex items-center bg-white/50 dark:bg-black/40 border border-black/5 dark:border-white/5 rounded-xl px-4 py-3 shadow-inner focus-within:border-coral transition-all">
                        <i data-lucide="mail" class="w-5 h-5 text-secondary mr-3"></i>
                        <input type="email" id="email-input" placeholder="name@example.com"
                            class="w-full bg-transparent outline-none text-sm font-medium text-primary placeholder-secondary/50">
                    </div>

                    <button onclick="simulateMagicLink()"
                        class="w-full bg-coral/10 hover:bg-coral/20 border border-coral/20 text-coral py-3.5 rounded-xl text-sm font-bold transition-all active:scale-95 flex items-center justify-center gap-2">
                        Send Magic Link <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Simulated Auth Routing (To be replaced with Supabase)
        function simulateGoogleLogin() {
            window.location.href = 'onboarding.html';
        }

        function simulateMagicLink() {
            const email = document.getElementById('email-input').value;
            if (!email) { alert("Please enter an email!"); return; }
            alert(`Simulated: Magic link sent to ${email}`);
            window.location.href = 'onboarding.html';
        }
    </script>
</body>

</html>
